<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arborist embed</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #ccc;
      }
      #viewer {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Arborist</strong>
      <select id="tree"></select>
      <button id="replay">Replay log</button>
      <button id="compare">Compare with an edited copy</button>
      <select id="theme">
        <option value="auto">Theme: system</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <span id="status"></span>
    </header>
    <div id="viewer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
