<!-- Source of the desktop app icon (icon.png, which electron-builder converts per platform). The mark
     matches src/web/arbor.svg, on Apple's 1024px icon grid: an 824px rounded square, 100px margin. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- 32-unit mark, scaled to the square and nudged down to center it optically -->
  <g transform="translate(100 131) scale(25.75)">
    <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <path d="M16 11.2V14M9 14h14M9 14v3.6M16 14v3.6M23 14v3.6"/>
    </g>
    <g fill="#ffffff">
      <circle cx="16" cy="8.5" r="3"/>
      <circle cx="9" cy="21.5" r="2.6"/>
      <circle cx="16" cy="21.5" r="2.6"/>
      <circle cx="23" cy="21.5" r="2.6"/>
    </g>
  </g>
</svg>
