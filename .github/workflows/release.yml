name: Release

# Builds a standalone `arbor` executable per platform (scripts/build_binary.mjs). Pushing a semver
# tag like v0.2.0 publishes them on a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    steps:
      - uses: actions/checkout@v5

      # The binary embeds this exact Node runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:binary

      - name: Smoke test
        shell: bash
        run: |
          ./release/arbor init smoke-project
          test -f smoke-project/bt_project.json

      - name: Package
        shell: bash
        run: |
          name="arbor-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          cp release/arbor* LICENSE README.md "pkg/$name/"
          cd pkg
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arbor-${{ matrix.target }}
          path: |
            pkg/*.tar.gz
            pkg/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: pkg
          merge-multiple: true

      - name: Checksums
        working-directory: pkg
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pkg/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
