name: Release

# Builds the Arbor desktop app (Electron, packaged by electron-builder) per platform. Pushing a
# semver tag like v0.2.0 publishes them on a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The app's version (and its file names) come from the tag.
      - name: Set version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - run: npm run build:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: arbor-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: pkg
          merge-multiple: true

      - name: Checksums
        working-directory: pkg
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pkg/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
